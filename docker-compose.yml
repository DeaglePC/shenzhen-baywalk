services:
  # ---------------------------------------------------------------------------
  # Production static server (Nginx + Vite dist bundle)
  # Quick start: docker compose up -d --build
  # ---------------------------------------------------------------------------
  baywalk:
    build:
      context: .
      dockerfile: Dockerfile
    image: shenzhen-baywalk:latest
    container_name: shenzhen-baywalk
    restart: unless-stopped
    ports:
      - "${BAYWALK_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Optional hot-reload dev server (no local Node.js required)
  # Usage: docker compose --profile dev up baywalk-dev
  # ---------------------------------------------------------------------------
  baywalk-dev:
    image: node:22-alpine
    profiles: ["dev"]
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5192"
    ports:
      - "${BAYWALK_DEV_PORT:-5192}:5192"
    volumes:
      - .:/app
      - baywalk_node_modules:/app/node_modules

volumes:
  baywalk_node_modules:
