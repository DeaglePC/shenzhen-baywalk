server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # Security headers (keep WebGL / PointerLock / Fullscreen functional)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # High-ratio Gzip compression for JSON GIS data, JS/CSS bundles, SVG, and 3D binary meshes
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        model/gltf-binary
        model/gltf+json
        application/octet-stream;

    # Lightweight container / reverse-proxy health endpoint
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Fingerprinted Vite build artifacts: immutable 1-year cache
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Explicit MIME type & caching for 3D GLTF/GLB meshes
    location ~* \.glb$ {
        default_type model/gltf-binary;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Explicit MIME type & caching for HDR environments & binary foliage geometry
    location ~* \.(hdr|bin)$ {
        default_type application/octet-stream;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Static GIS datasets, textures, portraits, and comparison imagery
    location ~* \.(webp|png|jpg|jpeg|svg|json|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # HTML entrypoints: always revalidate so new releases appear immediately
    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Default entrypoint & query-parameter deep links (e.g. /?walk=skyline, /?tour=bay-grand)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
